[project]
name = "audio-recorder"
version = "0.1.0"
description = "Capture macOS system audio using ScreenCaptureKit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyobjc-core>=10.0",
    "pyobjc-framework-ScreenCaptureKit>=10.0",
    "pyobjc-framework-CoreMedia>=10.0",
    "click>=8.1",
    "lameenc>=1.8.1",
    "mlx-whisper>=0.4.3",
    "useful-moonshine-onnx>=20251121",
    "google-genai>=1.0",
]

[project.scripts]
audio-recorder = "audio_recorder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_recorder"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pre-commit>=3.7",
]
